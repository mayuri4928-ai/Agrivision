    <script>
      (function() {
        // Immediately unregister any stale Service Workers & Workbox caches that can block preview
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            for (var i = 0; i < regs.length; i++) {
              regs[i].unregister().catch(function() {});
            }
          }).catch(function() {});
        }
        if ('caches' in window) {
          caches.keys().then(function(keys) {
            for (var j = 0; j < keys.length; j++) {
              if (keys[j].indexOf('workbox') !== -1 || keys[j].indexOf('agrivision-offline') !== -1) {
                caches.delete(keys[j]).catch(function() {});
              }
            }
          }).catch(function() {});
        }

        // Handle Vite HMR WebSocket in preview environment where HMR is disabled
        var RealWebSocket = window.WebSocket;
        if (RealWebSocket) {
          window.WebSocket = function(url, protocols) {
            var isViteHmr = protocols === 'vite-hmr' ||
              (typeof protocols === 'string' && protocols.indexOf('vite') !== -1) ||
              (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1) ||
              (typeof url === 'string' && (url.indexOf('token=') !== -1 || url.indexOf('24678') !== -1));

            if (isViteHmr) {
              var target = new EventTarget();
              var dummyWs = {
                url: url,
                readyState: 1,
                send: function() {},
                close: function() { dummyWs.readyState = 3; },
                addEventListener: function(type, fn, opts) {
                  target.addEventListener(type, fn, opts);
                  if (type === 'open') {
                    setTimeout(function() {
                      var ev = new Event('open');
                      target.dispatchEvent(ev);
                      if (dummyWs.onopen) dummyWs.onopen(ev);
                    }, 0);
                  }
                },
                removeEventListener: function(type, fn, opts) {
                  target.removeEventListener(type, fn, opts);
                },
                dispatchEvent: function(ev) { return target.dispatchEvent(ev); },
                onopen: null,
                onmessage: null,
                onerror: null,
                onclose: null
              };
              setTimeout(function() {
                var ev = new Event('open');
                target.dispatchEvent(ev);
                if (dummyWs.onopen) dummyWs.onopen(ev);
              }, 0);
              return dummyWs;
            }
            return new RealWebSocket(url, protocols);
          };
          window.WebSocket.prototype = RealWebSocket.prototype;
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
        }

        // Global uncaught error filter for Vite dev HMR WebSocket
        window.addEventListener('error', function(event) {
          var msg = event && (event.message || '');
          var file = event && (event.filename || '');
          if (
            msg.indexOf('WebSocket') !== -1 ||
            msg.indexOf('vite') !== -1 ||
            msg.indexOf('HMR') !== -1 ||
            file.indexOf('@vite/client') !== -1
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        // Global unhandled promise rejection filter for Vite dev HMR WebSocket
        window.addEventListener('unhandledrejection', function(event) {
          var reason = event && event.reason;
          var msg = reason instanceof Error ? reason.message : String(reason || '');
          if (
            msg.indexOf('WebSocket') !== -1 ||
            msg.indexOf('vite') !== -1 ||
            msg.indexOf('HMR') !== -1
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        // Filter out [vite] websocket warning / errors from console
        var origConsoleError = console.error;
        console.error = function() {
          var str = '';
          for (var i = 0; i < arguments.length; i++) {
            str += String(arguments[i]) + ' ';
          }
          if (
            str.indexOf('WebSocket') !== -1 ||
            str.indexOf('[vite]') !== -1 ||
            str.indexOf('vite:ws') !== -1
          ) {
            return;
          }
          return origConsoleError.apply(console, arguments);
        };
      })();
    </script>
