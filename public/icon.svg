<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Rich deep emerald twilight -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Main Leaf Gradient: Vibrant multi-stage organic green with golden sunlit crest -->
    <linearGradient id="leafGradMain" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="35%" stop-color="#22c55e" />
      <stop offset="70%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>

    <!-- Secondary Leaf / Companion Sprout Gradient -->
    <linearGradient id="leafGradSecondary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86efac" />
      <stop offset="60%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#14532d" />
    </linearGradient>

    <!-- Wheat Spike / Harvest Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <!-- AI Scanner & Neural Circuit Cyan Glow -->
    <linearGradient id="aiCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Subtle Radial Lens Glow behind Central Motif -->
    <radialGradient id="centerAura" cx="50%" cy="46%" r="48%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.32" />
      <stop offset="60%" stop-color="#059669" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#064e3b" stop-opacity="0" />
    </radialGradient>

    <!-- Filter for soft modern shadow -->
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded App Tile Canvas (Squircles for iOS & Android standards) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Ambient Internal Glow -->
  <circle cx="256" cy="245" r="210" fill="url(#centerAura)" />

  <!-- Futuristic Precision Crop Scouting Reticle / Corner Brackets -->
  <g stroke="url(#aiCyanGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.95">
    <!-- Top-Left Bracket -->
    <path d="M 72 144 L 72 96 A 24 24 0 0 1 96 72 L 144 72" />
    <!-- Top-Right Bracket -->
    <path d="M 368 72 L 416 72 A 24 24 0 0 1 440 96 L 440 144" />
    <!-- Bottom-Right Bracket -->
    <path d="M 440 368 L 440 416 A 24 24 0 0 1 416 440 L 368 440" />
    <!-- Bottom-Left Bracket -->
    <path d="M 144 440 L 96 440 A 24 24 0 0 1 72 416 L 72 368" />
  </g>

  <!-- Corner Reticle Micro Dots -->
  <circle cx="72" cy="72" r="6" fill="#38bdf8" />
  <circle cx="440" cy="72" r="6" fill="#38bdf8" />
  <circle cx="440" cy="440" r="6" fill="#38bdf8" />
  <circle cx="72" cy="440" r="6" fill="#38bdf8" />

  <!-- Radar / Laser AI Scan Arc (Top subtle indicator) -->
  <path d="M 176 88 A 120 120 0 0 1 336 88" fill="none" stroke="url(#aiCyanGrad)" stroke-width="5" stroke-linecap="round" stroke-dasharray="14 12" opacity="0.65" />

  <!-- Central Botanical Motif with Shadow -->
  <g filter="url(#softShadow)">
    <!-- Right Golden Wheat Grains (Representing Indian Agronomy & Harvest) -->
    <g fill="url(#goldGrad)" opacity="0.92">
      <!-- Grain 1 -->
      <path d="M 315 285 C 342 278 360 258 358 244 C 344 244 326 260 315 285 Z" />
      <line x1="315" y1="285" x2="368" y2="236" stroke="#fef08a" stroke-width="3" stroke-linecap="round" />

      <!-- Grain 2 -->
      <path d="M 326 242 C 356 232 374 212 370 198 C 354 198 336 215 326 242 Z" />
      <line x1="326" y1="242" x2="382" y2="190" stroke="#fef08a" stroke-width="3" stroke-linecap="round" />

      <!-- Grain 3 -->
      <path d="M 330 198 C 362 186 378 165 372 152 C 356 153 338 172 330 198 Z" />
      <line x1="330" y1="198" x2="384" y2="142" stroke="#fef08a" stroke-width="3" stroke-linecap="round" />

      <!-- Wheat Stem Curve -->
      <path d="M 275 350 Q 312 270 330 190" fill="none" stroke="#eab308" stroke-width="4.5" stroke-linecap="round" />
    </g>

    <!-- Companion Left Smaller Leaf / Shoot -->
    <path d="M 235 345 C 160 340 145 255 185 205 C 205 240 230 275 245 325 Z" fill="url(#leafGradSecondary)" opacity="0.88" />

    <!-- Main Majestic Primary Leaf (Symbolizing Crop Health & Diagnosis) -->
    <!-- Beautiful organic curve peaking at top, tapering smoothly to base -->
    <path d="M 268 115 C 165 140 160 270 205 350 C 220 375 250 395 264 402 C 274 375 350 315 350 220 C 350 148 305 118 268 115 Z" fill="url(#leafGradMain)" />

    <!-- Leaf Central Spine / Neural Stem -->
    <path d="M 268 118 Q 256 250 252 400" fill="none" stroke="#f0fdf4" stroke-width="7" stroke-linecap="round" opacity="0.95" />

    <!-- Leaf Lateral Veins integrated into Neural Circuit Traces -->
    <!-- Left Vein 1 -->
    <path d="M 262 180 Q 220 185 198 172" fill="none" stroke="#f0fdf4" stroke-width="5" stroke-linecap="round" opacity="0.85" />
    <!-- Right Vein 1 -->
    <path d="M 264 210 Q 295 210 324 195" fill="none" stroke="#f0fdf4" stroke-width="5" stroke-linecap="round" opacity="0.85" />
    <!-- Left Vein 2 -->
    <path d="M 258 240 Q 215 255 186 242" fill="none" stroke="#f0fdf4" stroke-width="5" stroke-linecap="round" opacity="0.85" />
    <!-- Right Vein 2 -->
    <path d="M 260 275 Q 298 280 328 265" fill="none" stroke="#f0fdf4" stroke-width="5" stroke-linecap="round" opacity="0.85" />
    <!-- Left Vein 3 -->
    <path d="M 256 308 Q 225 325 204 320" fill="none" stroke="#f0fdf4" stroke-width="4.5" stroke-linecap="round" opacity="0.8" />
  </g>

  <!-- High-Tech Neural Nodes & AI Pathology Sensors -->
  <g filter="url(#glowFilter)">
    <!-- Node Apex Sensor -->
    <circle cx="268" cy="118" r="8" fill="#67e8f9" />
    <circle cx="268" cy="118" r="4" fill="#ffffff" />

    <!-- Left Vein Terminals -->
    <circle cx="198" cy="172" r="7" fill="#38bdf8" />
    <circle cx="198" cy="172" r="3.5" fill="#ffffff" />

    <circle cx="186" cy="242" r="7" fill="#38bdf8" />
    <circle cx="186" cy="242" r="3.5" fill="#ffffff" />

    <circle cx="204" cy="320" r="6" fill="#38bdf8" />
    <circle cx="204" cy="320" r="3" fill="#ffffff" />

    <!-- Right Vein Terminals -->
    <circle cx="324" cy="195" r="7" fill="#38bdf8" />
    <circle cx="324" cy="195" r="3.5" fill="#ffffff" />

    <circle cx="328" cy="265" r="7" fill="#38bdf8" />
    <circle cx="328" cy="265" r="3.5" fill="#ffffff" />

    <!-- Central Neural Core Node -->
    <circle cx="260" cy="245" r="10" fill="#22c55e" stroke="#ffffff" stroke-width="3" />
    <circle cx="260" cy="245" r="4.5" fill="#ffffff" />
  </g>

  <!-- Horizontal Scanning Laser Beam with Soft Gradient -->
  <line x1="120" y1="245" x2="392" y2="245" stroke="url(#aiCyanGrad)" stroke-width="2.5" stroke-dasharray="16 8" opacity="0.6" />

  <!-- Botanical Specimen Diagnostic Crosshair in upper quadrant -->
  <g stroke="#38bdf8" stroke-width="2" opacity="0.5" fill="none">
    <circle cx="388" cy="120" r="14" />
    <line x1="388" y1="102" x2="388" y2="138" />
    <line x1="370" y1="120" x2="406" y2="120" />
  </g>
</svg>
